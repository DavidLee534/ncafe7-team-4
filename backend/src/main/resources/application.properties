spring.application.name=backend

# 비밀번호 등 공개하면 안 되는 값은 프로젝트 루트의 secret.properties(.gitignore 대상)에 둔다.
# 같은 이름의 환경변수가 있으면 그 값이 우선한다.
spring.config.import=optional:file:./secret.properties

# 팀 DB: cloud.newlecture.com 의 postgres-team-4 (PostgreSQL 16, 할당 포트 5444)
spring.datasource.url=jdbc:postgresql://cloud.newlecture.com:5444/ncafedb
spring.datasource.username=ncafe
spring.datasource.password=${DB_PASSWORD}

# 개발용: 엔티티를 보고 테이블을 자동 생성/수정한다.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# 테이블이 만들어진 뒤에 data.sql 을 실행한다 (단계 4에서 사용).
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
