# 로컬 기능 확인 전용: ./gradlew bootRun --args='--spring.profiles.active=h2'
# 종료하면 데이터가 사라진다. PostgreSQL 운영 설정에는 적용되지 않는다.
spring:
  datasource:
    url: jdbc:h2:mem:ncafe;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
